name: Copy results to frontend

on:
  push:
    branches:
      - main
    paths:
      - results/final/metadata.json
      - results/final/nif_clusters.csv
      - results/final/fastas/**

jobs:
  copy-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Copy results to frontend
        shell: bash
        run: |
          set -euo pipefail

          destination="website/frontend/public/results"
          mkdir -p "$destination/fastas"

          cp results/final/metadata.json "$destination/metadata.json"
          cp results/final/nif_clusters.csv "$destination/nif_clusters.csv"

          for source in results/final/fastas/*; do
            filename="${source##*/}"
            cp "$source" "$destination/fastas/${filename#final_}"
          done

      - name: Commit copied results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner/frontend/public/results

          if git diff --cached --quiet; then
            echo "No copied result changes to commit."
            exit 0
          fi

          git commit -m "Update frontend result files"
          git push
