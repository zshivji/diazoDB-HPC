server {
  listen 80;

  root /usr/share/nginx/html;

  location = / {
    try_files /home.html =404;
  }

  location = /docs {
    try_files /wiki.html =404;
  }

  location = /data {
    try_files /database.html =404;
  }

  location / {
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
